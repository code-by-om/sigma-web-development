        .boxes::before {
            content: "Om is good boy";
            color: red;
        }

        .boxes::after {
            content: "Om is good boy";
            color: blue;
        }

        ::selection {
            background-color: red;
            color: white;
        }

        .box::first-letter {
            color: red;
            font-size: 30px;
        }

        input::placeholder {
            color: rgb(80, 79, 79);

        }
    </style>
</head>

<body>
    <div class="boxes">
        <div data-color="primary" class="box">I am the first box</div>
        <div class="box">Hey i am box</div>
        <div class="box">Hey i am box</div>
        <input type="text" placeholder="Enter your name">
    </div>
</body>
